app = "tutor-court"
primary_region = "ord"

[build]

# Run DB migrations once per deploy, before the new machines take traffic. Uses
# the DATABASE_URL secret injected by Fly into the release machine.
[deploy]
  release_command = "pnpm payload migrate"

[env]
  NODE_ENV = "production"
  HOSTNAME = "0.0.0.0"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # Live classes hold a long-lived WebSocket per participant, so scale on
  # concurrent CONNECTIONS, not HTTP requests.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"

# Secrets to set before first deploy (never commit these):
#   fly secrets set DATABASE_URL=postgres://...            # Postgres connection
#   fly secrets set PAYLOAD_SECRET=...                     # Payload/JWT signing
#   fly secrets set CLOUDFLARE_TURN_KEY_ID=...             # TURN relay (NAT traversal)
#   fly secrets set CLOUDFLARE_TURN_API_TOKEN=...
#   # plus the app's existing secrets: PAYSTACK_*, ZEPTO_MAIL_*, TIGRIS_*,
#   # QSTASH_TOKEN, UPSTASH_*, CRON_SECRET, CRON_TARGET_BASE_URL
